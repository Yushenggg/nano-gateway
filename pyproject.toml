[project]
name = "nanogateway"
version = "0.1.1"
description = "Ultra-lightweight AI Gateway proxy server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Yue Sheng", email = "a.yuesheng@gmail.com" },
]
keywords = ["ai", "llm", "gateway", "proxy", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Web Environment",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.urls]
 Homepage = "https://github.com/Yushenggg/nano-gateway"
Repository = "https://github.com/Yushenggg/nano-gateway"
Issues = "https://github.com/Yushenggg/nano-gateway/issues"

[project.optional-dependencies]
injection = []
guardrails = ["nanogateway[injection]"]
dev = ["pytest>=8.3.0"]

[project.scripts]
nanogateway = "nanogateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanogateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
